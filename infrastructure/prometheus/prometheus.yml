global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'sharp-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['sharp-backend:8080']

  - job_name: 'sharp-ai-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['sharp-ai-service:8000']
