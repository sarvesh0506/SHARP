server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: sharp-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

sharp:
  jwt:
    secret: ${JWT_SECRET:4c5f928e1d2b3a4c5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  ai:
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    connection-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:3000}
    response-timeout-ms: ${AI_RESPONSE_TIMEOUT_MS:10000}
    max-retries: 1
  monitoring:
    enabled: ${MONITORING_ENABLED:true}
    poll-interval-ms: ${MONITORING_POLL_INTERVAL_MS:10000}
    retention-hours: ${MONITORING_RETENTION_HOURS:24}
    process-limit: ${MONITORING_PROCESS_LIMIT:100}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.sharp: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
